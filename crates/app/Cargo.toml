[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "deck"
path = "src/main.rs"

[features]
default = ["ghostty"]
# The Ghostty terminal engine (Settings → Terminal → Engine). Building it
# needs Zig 0.17 on PATH; without it, `--no-default-features` builds
# Alacritty only.
ghostty = ["term/ghostty"]

[dependencies]
smol_str.workspace = true
term.workspace = true
agent-core.workspace = true
agent-claude.workspace = true
agent-cli.workspace = true
session.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
gpui.workspace = true
# Already built for gpui (same version, its default codecs); used to crop
# attachment thumbnails.
image = "0.25"
wry.workspace = true
raw-window-handle.workspace = true
libc = "0.2"
# Code colouring in chats: bat's grammars, on a pure-Rust regex engine.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }

# WebKitGTK's event loop, run inside gpui's (see gtk_loop.rs). The version
# wry builds against.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# XSetInputFocus, to take the keyboard back from a page (the version wry
# already builds).
x11-dl = "2.21"
gdkx11 = "0.18"

# HTTP for the browser chrome and accounts; macOS uses NSURLSession.
[target.'cfg(not(target_os = "macos"))'.dependencies]
ureq = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit.workspace = true
objc2-quartz-core = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
block2 = "0.6"
objc2 = "0.6"
objc2-user-notifications = "0.3"
